# Alembic config. The database URL is NOT set here — alembic/env.py builds it
# from app.core.config.settings (i.e. from .env), so there is one source of
# truth for credentials.

# This file lives inside alembic/ to keep the repo root small — invoke with
#   alembic -c alembic/alembic.ini <command>
# from the repo root (make migrate does this).

[alembic]
# %(here)s = the directory of this ini file, i.e. alembic/ itself
script_location = %(here)s
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
