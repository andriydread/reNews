# Dev/test tooling — not needed on the production service. Install with:
#   .venv/bin/pip install --group dev
[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "respx==0.22.0",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped engine fixture and the
# per-test asyncpg connections must live on the same loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import order, B bugbear
select = ["E", "F", "I", "B"]
# E501: long lines — templates/prompts read better unwrapped
# B008: `Depends()` in argument defaults is idiomatic FastAPI
ignore = ["E501", "B008"]
